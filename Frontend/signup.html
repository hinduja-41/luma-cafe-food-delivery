<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luma Café | Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f5ef;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #e85d25;
            font-size: 32px;
        }

        .logo p {
            color: #777;
            margin-top: 5px;
        }

        .signup-container h2 {
            text-align: center;
            margin: 25px 0;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #e85d25;
        }

        .signup-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #e85d25;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .signup-btn:hover {
            opacity: 0.9;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-link a {
            color: #e85d25;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 500px) {

            .signup-container {
                padding: 25px;
            }

        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">
            <h1>LUMA</h1>
            <p>Café & Kitchen</p>
        </div>

        <h2>Create Your Account</h2>

        <form id="signupForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>


            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>


            <button
                type="submit"
                class="signup-btn">
                Create Account
            </button>

        </form>


        <div
            id="message"
            class="message">
        </div>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <script>

        const signupForm =
            document.getElementById("signupForm");

        signupForm.addEventListener("submit", async function(event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const password =
                document.getElementById("password").value;


            const message =
                document.getElementById("message");


            try {

                const response = await fetch(
                    "https://lluma-cafe-backend.onrender.com/api/customers/signup",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            phone: phone,
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.error ||
                        "Unable to create account.";

                    message.style.color = "red";

                    return;
                }


                message.textContent =
                    "Account created successfully! ✅";

                message.style.color = "green";


                signupForm.reset();


                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1500);


            } catch (error) {

                console.error(
                    "Signup error:",
                    error
                );

                message.textContent =
                    "Unable to connect to server.";

                message.style.color = "red";
            }

        });

    </script>

</body>
</html>
