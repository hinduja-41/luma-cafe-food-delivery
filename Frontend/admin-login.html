<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Luma Café - Admin Login</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="admin-login-container">

        <div class="admin-login-card">

            <div class="admin-login-header">

                <span>LUMA CAFÉ</span>

                <h1>Admin Login</h1>

                <p>
                    Sign in to manage customer orders
                </p>

            </div>


            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="adminLoginBtn">
                    Login
                </button>


                <p
                    id="adminLoginMessage"
                    class="login-message">
                </p>

            </form>


            <a
                href="index.html"
                class="back-link">
                ← Back to Website
            </a>

        </div>

    </div>


    <script src="admin-login.js"></script>

</body>

</html>
